# Voor je NAS: haalt de kant-en-klare image op, je hebt de broncode niet nodig.
# Vervang GEBRUIKER door je GitHub-gebruikersnaam (kleine letters) en "tidy" door de naam van je repository.
services:
  logboek:
    image: ghcr.io/GEBRUIKER/tidy:latest
    container_name: logboek
    restart: unless-stopped
    ports:
      - "4145:3000" # app bereikbaar op http://<ip-van-je-nas>:4145
    environment:
      # Zet op "true" zodra je de app via HTTPS bereikt (bv. achter een reverse proxy).
      COOKIE_SECURE: "false"
      # Zet op "true" als de app achter Cloudflare of Nginx Proxy Manager staat: dan geldt de
      # blokkade na mislukte logins per IP-adres in plaats van voor iedereen samen.
      # Laat op "false" als de app rechtstreeks bereikbaar is (de headers zijn dan vervalsbaar).
      TRUST_PROXY: "false"
      # Alleen tijdelijk aanzetten om het account te resetten (data blijft behouden):
      # LOGBOEK_RESET_AUTH: "true"
    volumes:
      # Alle data (database + geüploade documenten) staat in dit volume.
      - logboek-data:/data

volumes:
  logboek-data:
